<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="description" content="Plantify Login Page">
    <meta name="keywords" content="Plantify, login, biodiversity, plants">
    <meta name="author" content="Plantify Team">
    <title>Plantify - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<bod class="login-page">

    <header>
        <div class="brand">
            <a href="index.html">
                <img src="Photos/plantify_logo.png" alt="Plantify">
            </a>
        </div>

        <nav aria-label="Main navigation">
            <a href="explore1.html">Explore</a>
            <a href="#">Identifier</a>
            <a href="contribute.html">Contribution</a>
            <a href="Aboutus.html">About Us</a>
            <a href="Enquiryform.html">Enquiry</a>
            <a href="login.html" aria-current="page">Login</a>
        </nav>
    </header>

    <main>

        <article class="login-container">

            <section class="login-box">

                <h1>Login</h1>

                <p>Login to access your Plantify account.</p>

                <form action="#" method="post">

                    <p>
                        <label for="login">Login:</label>
                        <input
                            type="text"
                            id="login"
                            name="login"
                            maxlength="10"
                            pattern="[A-Za-z]+"
                            required>
                    </p>

                    <p>
                        <label for="password">Password:</label>
                        <input
                            type="text"
                            id="password"
                            name="password"
                            maxlength="25"
                            pattern="[A-Za-z]+"
                            required>
                    </p>

                    <p class="login-buttons">
                        <input type="submit" value="Login">
                        <input type="reset" value="Clear">
                    </p>

                </form>

            </section>

        </article>

    </main>

    <footer>
        <p><super>&reg;</super>Plantify</p>
    </footer>

</body>

</html>
