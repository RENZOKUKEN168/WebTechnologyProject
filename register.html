<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="registration form">
<title>Registration form</title>

<link rel="stylesheet" href="style.css">


</head>
<body class="register-page">
    <header>
        <div class="brand">
            <a href="index.html">
            <img src="Photos/plantify_logo.png" alt="Plantify"></a>
        </div>

        <nav aria-label="Main navigation">
            <a href="explore1.html" aria-current="page">Explore</a>
            <a href="#">Identifier</a>
            <a href="contribute.html">Contribution</a>
            <a href="Aboutus.html">About Us</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="login.html">Login</a>
        </nav>

        <div class="header-right">
            <input type="search" aria-label="Search Plantify" placeholder="Search">
        </div>
    </header>


<div class="container">
    <h2>Create an Account</h2>
    <form method="post">
    
   
		<div class="form-group">
            <label for="fname">First Name:</label>
            <input type="text" id="firstname" name="firstname" maxlength="25" pattern="[A-Za-z\s]+" title="Alphabetical characters only" required>
        </div>


		<div class="form-group">
            <label for="lname">Last Name:</label>
            <input type="text" id="lastname" name="lastname" maxlength="25" pattern="[A-Za-z\s]+" title="Alphabetical characters only" required>
        </div>


		<div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </div>



        <fieldset>
            <legend>Address</legend>
            

			<div class="form-group">
                <label for="street_address">Street Address:</label>
                <input type="text" id="stadd" name="stadd" maxlength="40" required>
            </div>


			<div class="form-group">
                <label for="city">City/Town:</label>
                <input type="text" id="city" name="city" maxlength="20" required>
            </div>


			<div class="form-group">
				<label for="state">State:</label>
				<select id="state" name="state" required>
					<option value="">-- Select State / Federal Territory --</option>
					<option value="Johor">Johor</option>
					<option value="Kedah">Kedah</option>
					<option value="Kelantan">Kelantan</option>
                    <option value="Melaka">Melaka</option>
					<option value="Negeri Sembilan">Negeri Sembilan</option>
                    <option value="Pahang">Pahang</option>
                    <option value="Penang">Penang</option>
                    <option value="Perak">Perak</option>
					<option value="Perlis">Perlis</option>
                    <option value="Sabah">Sabah</option>
					<option value="Sarawak">Sarawak</option>
                    <option value="Selangor">Selangor</option>
                    <option value="Terengganu">Terengganu</option>
                    <option value="Kuala Lumpur">Kuala Lumpur</option>
					<option value="Labuan">Labuan</option>
                    <option value="Putrajaya">Putrajaya</option>
                </select>
            </div>


			<div class="form-group">
                <label for="postcode">Postcode:</label>
                <input type="text" oninput="this.value = this.value.replace(/[^0-9]/g, '')" id="postcode" name="postcode" pattern="\d{5}" maxlength="5" title="Must be exactly 5 digits" required>
            </div>
        </fieldset>


        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" oninput="this.value = this.value.replace(/[^0-9]/g, '')" id="phone" name="phone" maxlength="10" placeholder="e.g. 0123456789" pattern="\d{1,10}" title="Maximum of 10 digits" required>
        </div>


        <button type="submit" class="registerbtn">Register</button>
        <button type="reset" class="registerbtn">Reset</button>


		<div class="form-group signin">
    			<p>Already have an account? <a href="#">Sign in</a>.</p>
		</div>
    
  
    
  
</form>
</div>

	<footer>
        <p>&copy; 2026 Plantify</p>
	</footer>
</body>

</html>
